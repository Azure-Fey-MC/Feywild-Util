[versions]
# The latest versions are available at https://fabricmc.net/develop
minecraft = "1.21.1"
fabric-loader = "0.19.1"
fabric-api = "0.116.10+1.21.1"
fabric-language-kotlin = "1.13.10+kotlin.2.3.20"
midnightlib = "1.10.0+1.21.1-fabric"
mod_menu = "11.0.4"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric_loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
fabric_language_kotlin = { module = "net.fabricmc:fabric-language-kotlin", version.ref = "fabric-language-kotlin" }
midnightlib = { module = "eu.midnightdust:midnightlib", version.ref = "midnightlib" }
mod_menu = { module = "com.terraformersmc:modmenu", version.ref = "mod_menu" }

# If you have multiple similar dependencies, you can declare a dependency bundle and reference it on the build script with "libs.bundles.example".
[bundles]
dev_mods = [ "mod_menu" ]
dependencies = [ "midnightlib" ]

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom-remap", version = "1.17-SNAPSHOT" }
pkpcpbp = { id = "at.petra-k.pkpcpbp.PKJson5Plugin", version = "0.2.0-pre-95" }

